name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Check the tag matches the workspace version
      run: |
        version=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name == "mill-io") | .version')
        if [ "$GITHUB_REF_NAME" != "v$version" ]; then
          echo "::error::tag $GITHUB_REF_NAME does not match the workspace version $version"
          exit 1
        fi

    - name: Extract release notes from CHANGELOG.md
      run: |
        awk -v v="${GITHUB_REF_NAME#v}" '
          index($0, "## [" v "]") == 1 { found = 1; next }
          found && /^## \[/ { exit }
          found { print }
        ' CHANGELOG.md > notes.md
        if ! grep -q '[^[:space:]]' notes.md; then
          echo "::error::CHANGELOG.md has no entry for $GITHUB_REF_NAME"
          exit 1
        fi

    - name: Publish to crates.io
      run: cargo publish -p mill-io -p mill-net -p mill-rpc-core -p mill-rpc-macros -p mill-rpc
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

    - name: Create the GitHub release
      run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
      env:
        GH_TOKEN: ${{ github.token }}
