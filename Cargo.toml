[workspace]
members = [
    "mill-io",
    "mill-net",
    "mill-rpc",
    "mill-rpc/mill-rpc-core",
    "mill-rpc/mill-rpc-macros",
    "mill-chain",
]
resolver = "2"

[workspace.package]
version = "4.0.0"
authors = ["Citadel-tech", "Mohamed Emad"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.74"

[workspace.dependencies]
mio = { version = "1.1.0", features = ["os-poll", "net"] }
lock_freedom = "0.1.1"
criterion = { version = "0.5.1", features = ["html_reports"] }
parking_lot = "0.12"

mill-io = { path = "mill-io", version = "4.0.0" }
mill-net = { path = "mill-net", version = "4.0.0" }
