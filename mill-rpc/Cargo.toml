[package]
name = "mill-rpc"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "An Axum-inspired RPC framework built on Mill-IO"
documentation = "https://docs.rs/mill-rpc"
homepage = "https://github.com/citadel-tech/mill-io"
repository = "https://github.com/citadel-tech/mill-io"
readme = "README.md"
keywords = ["rpc", "mill-io", "event-loop", "networking", "services"]
categories = ["network-programming", "asynchronous"]

[dependencies]
mill-rpc-core = { path = "mill-rpc-core", version = "3.0.0" }
mill-rpc-macros = { path = "mill-rpc-macros", version = "3.0.0" }
mill-io = { path = "../mill-io", version = "3.0.0" }
mill-net = { path = "../mill-net", version = "3.0.0" }
serde = { version = "1", features = ["derive"] }
bincode = "1"
log = "0.4"
mio = { version = "1", features = ["os-poll", "net"] }

[dev-dependencies]
env_logger = "0.11"
criterion = { version = "0.5", features = ["html_reports"] }
serde_cbor = "0.11"
mill-net = { path = "../mill-net", features = ["testing"] }
rand = "0.8"
mill-rpc-core = { path = "mill-rpc-core" }
socket2 = "0.6"

[[example]]
name = "calculator_server"
path = "examples/calculator_server.rs"

[[example]]
name = "calculator_client"
path = "examples/calculator_client.rs"

[[example]]
name = "echo_server"
path = "examples/echo_server.rs"

[[example]]
name = "echo_client"
path = "examples/echo_client.rs"

[[example]]
name = "kv_server"
path = "examples/kv_server.rs"

[[example]]
name = "kv_client"
path = "examples/kv_client.rs"

[[example]]
name = "multi_service_server"
path = "examples/multi_service_server.rs"

[[example]]
name = "multi_service_client"
path = "examples/multi_service_client.rs"

[[example]]
name = "concurrent_clients"
path = "examples/concurrent_clients.rs"

[[bench]]
name = "rpc_comparison"
harness = false
