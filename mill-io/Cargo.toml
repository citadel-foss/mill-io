[package]
name = "mill-io"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "A lightweight event loop library for Rust providing efficient non-blocking I/O management"
documentation = "https://docs.rs/mill-io"
homepage = "https://github.com/citadel-tech/mill-io"
repository = "https://github.com/citadel-tech/mill-io"
readme = "README.md"
keywords = ["io", "event-loop", "mio", "reactor", "async"]
categories = ["network-programming", "asynchronous", "concurrency"]

[dependencies]
mio.workspace = true
lock_freedom.workspace = true
parking_lot.workspace = true
mill-io-macros = { workspace = true, optional = true }

[dev-dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"
mill-net = { path = "../mill-net" }
criterion.workspace = true

[features]
default = ["macros"]
# The #[mill_io::main] and #[mill_io::test] attributes (pulls in syn).
macros = ["dep:mill-io-macros"]
unstable-mpmc = []
unstable = ["unstable-mpmc"]

[target.'cfg(target_os = "linux")'.dev-dependencies]
inotify = "0.10"

[[bench]]
name = "comprehensive"
harness = false

[[example]]
name = "spawn_join"
required-features = ["macros"]

[[example]]
name = "timers_in_context"
required-features = ["macros"]
