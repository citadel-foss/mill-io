[package]
name = "mill-chain"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Bitcoin chain backends (Bitcoin Core, Electrum) on the mill-io event loop, with a blocking facade."
documentation = "https://docs.rs/mill-chain"
homepage = "https://github.com/citadel-tech/mill-io"
repository = "https://github.com/citadel-tech/mill-io"
readme = "README.md"
keywords = ["bitcoin", "electrum", "json-rpc", "mill-io", "event-loop"]
categories = ["network-programming", "cryptography::cryptocurrencies"]

[dependencies]
base64 = "0.22"
bitcoin = { version = "0.32", features = ["serde"] }
crossbeam-channel = "0.5"
log = "0.4"
mill-io.workspace = true
mill-net.workspace = true
rustls = { version = "0.23.40", default-features = false, features = ["std", "ring", "tls12", "logging"], optional = true }
serde_json = "1"
sha2 = { version = "0.10", optional = true }
webpki-roots = { version = "1", optional = true }

[dev-dependencies]
bitcoincore-rpc-json = "0.19"
bitcoind = "0.36"
mill-net = { workspace = true, features = ["testing"] }
proptest = "1"
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }

[features]
# Enables the test backend (`ChainConfig::RawLineJsonRpc`) and the `testing` module.
testing = []
# TLS connections (rustls with ring, WebPKI roots, certificate pins).
tls = ["dep:rustls", "dep:sha2", "dep:webpki-roots"]

[[test]]
name = "engine"
required-features = ["testing"]

[[test]]
name = "http"
required-features = ["testing"]

[[test]]
name = "core_rpc"
required-features = ["testing"]

[[test]]
name = "core_parity"
required-features = ["testing"]

[[test]]
name = "socks5"
required-features = ["testing"]

[[test]]
name = "tls"
required-features = ["testing", "tls"]

[[test]]
name = "tor"
required-features = ["testing"]
